<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Nearby Water Quality</title>
  <style>
    /* === Clean Aqua Gradient Background === */
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #dff7ff 0%, #b4ecf9 50%, #9ce1f3 100%);
      overflow: hidden;
      position: relative;
      color: #024a5e;
    }

    /* === Soft floating transparent water droplets === */
    .droplet {
      position: absolute;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.1) 70%);
      border-radius: 50%;
      box-shadow:
        inset -5px -5px 10px rgba(255, 255, 255, 0.5),
        inset 5px 5px 10px rgba(0, 170, 200, 0.2);
      opacity: 0.8;
      animation: float 18s ease-in-out infinite;
    }

    .drop1 { width: 60px; height: 60px; top: 20%; left: 15%; animation-delay: 0s; }
    .drop2 { width: 40px; height: 40px; top: 70%; left: 25%; animation-delay: 2s; }
    .drop3 { width: 50px; height: 50px; top: 40%; left: 60%; animation-delay: 4s; }
    .drop4 { width: 75px; height: 75px; top: 65%; left: 80%; animation-delay: 1s; }
    .drop5 { width: 30px; height: 30px; top: 35%; left: 75%; animation-delay: 3s; }

    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.85; }
      50% { transform: translateY(-25px) translateX(5px); opacity: 1; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.85; }
    }

    /* === Back Home Button === */
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      background-color: rgba(0, 160, 185, 0.9);
      color: white;
      padding: 10px 25px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 16px;
      transition: 0.3s;
      box-shadow: 0 4px 12px rgba(0, 172, 193, 0.3);
      z-index: 3;
    }

    .back-btn:hover {
      background-color: #0097a7;
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }

    /* === Frosted Glass Form === */
    .form-container {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 50px 60px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      width: 400px;
      z-index: 2;
    }

    h1 {
      font-size: 26px;
      color: #015b70;
      margin-bottom: 25px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    table {
      width: 100%;
    }

    td {
      padding: 10px;
      font-size: 18px;
    }

    input[type="text"] {
      width: 90%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      color: #01579b;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.15);
      transition: 0.3s;
    }

    input[type="text"]:focus {
      background-color: #e0f7fa;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
    }

    input[type="submit"] {
      background-color: #00bcd4;
      color: white;
      padding: 12px 35px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    input[type="submit"]:hover {
      background-color: #0097a7;
      transform: scale(1.06);
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <!-- Floating translucent droplets -->
  <div class="droplet drop1"></div>
  <div class="droplet drop2"></div>
  <div class="droplet drop3"></div>
  <div class="droplet drop4"></div>
  <div class="droplet drop5"></div>

  <!-- Back to Home Button -->
  <a href="/temp/technician/" class="back-btn">← Back Home</a>

  <!-- Form Container -->
  <div class="form-container">
    <form method="POST">
      {% csrf_token %}
      <h1>Add Nearby Water Quality</h1>
      <table>
        <tr>
          <td>Place</td>
          <td><input type="text" name="place" required></td>
        </tr>
        <tr>
          <td>PH</td>
          <td><input type="text" name="ph" required></td>
        </tr>
        <tr>
          <td colspan="2" style="text-align:center;">
            <input type="submit" value="Add">
          </td>
        </tr>
      </table>
    </form>
  </div>

</body>
</html>
