<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>View Complaint Reply</title>
	<style>
	    body {
	        margin: 0;
	        padding: 60px 20px 20px 20px;
	        font-family: 'Poppins', sans-serif;
	        background: linear-gradient(135deg, #b3e5fc, #4dd0e1, #0288d1);
	        color: #004d40;
	        position: relative;
	        min-height: 100vh;
	        overflow: hidden;
	    }

	    /* Animated water ripple effect */
	    body::before {
	        content: "";
	        position: absolute;
	        inset: 0;
	        background: url('https://www.transparenttextures.com/patterns/water.png');
	        opacity: 0.15;
	        animation: moveWater 30s linear infinite;
	        z-index: 0;
	    }

	    @keyframes moveWater {
	        from { background-position: 0 0; }
	        to { background-position: 1000px 1000px; }
	    }

	    /* Back Home Button */
	    .home-button {
	        position: absolute;
	        top: 20px;
	        left: 20px;
	        background: linear-gradient(135deg, #e0f7fa, #80deea);
	        color: #004d40;
	        padding: 10px 20px;
	        text-decoration: none;
	        border-radius: 8px;
	        font-weight: 600;
	        box-shadow: 0 4px 10px rgba(0, 150, 200, 0.3);
	        backdrop-filter: blur(8px);
	        transition: all 0.3s ease;
	        z-index: 2;
	    }

	    .home-button:hover {
	        background: linear-gradient(135deg, #4dd0e1, #00acc1);
	        color: white;
	        box-shadow: 0 6px 16px rgba(0, 200, 255, 0.5);
	        transform: scale(1.05);
	    }

	    center {
	        display: block;
	        margin: auto;
	        max-width: 850px;
	        padding: 30px;
	        background: rgba(255, 255, 255, 0.25);
	        border-radius: 14px;
	        box-shadow: 0 8px 25px rgba(0, 100, 150, 0.3);
	        backdrop-filter: blur(10px);
	        position: relative;
	        z-index: 1;
	    }

	    h1 {
	        color: #004d80;
	        font-weight: 700;
	        margin-bottom: 25px;
	        text-shadow: 0 0 8px rgba(0, 150, 255, 0.4);
	        letter-spacing: 1px;
	    }

	    table {
	        width: 100%;
	        border-collapse: collapse;
	        background-color: rgba(255, 255, 255, 0.7);
	        box-shadow: 0 0 12px rgba(0, 150, 200, 0.3);
	        border-radius: 10px;
	        overflow: hidden;
	    }

	    th, td {
	        border: 2px solid rgba(0, 77, 64, 0.2);
	        padding: 12px 15px;
	        text-align: center;
	        font-size: 1rem;
	        font-weight: 500;
	    }

	    th {
	        background: linear-gradient(135deg, #0288d1, #00acc1);
	        color: white;
	        text-transform: uppercase;
	        letter-spacing: 1px;
	    }

	    tr:nth-child(even) {
	        background-color: rgba(178, 235, 242, 0.8);
	    }

	    tr:hover {
	        background-color: rgba(128, 222, 234, 0.8);
	        transition: background-color 0.3s ease;
	    }

	    @media (max-width: 600px) {
	        .home-button {
	            left: 10px;
	            top: 10px;
	            padding: 8px 14px;
	            font-size: 14px;
	        }

	        center {
	            width: 95%;
	            padding: 20px;
	        }

	        th, td {
	            font-size: 0.9rem;
	        }
	    }
	</style>
</head>
<body>

	<!-- Back Home Button -->
	<a href="/temp/user/" class="home-button">← Back Home</a>

	<center>
		<h1>View Complaint Replies</h1>
		<table>
			<tr>
				<th>Complaint</th>
				<th>Reply</th>
			</tr>
	        {% for i in comp_reply %}
	        <tr>
         		<td>{{ i.complaint }}</td>
         		<td>{{ i.replay }}</td>
         	</tr>
	        {% endfor %}
	    </table>
	</center>

</body>
</html>
