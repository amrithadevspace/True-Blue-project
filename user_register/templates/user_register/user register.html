<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User Register</title>

	<!-- Google Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: 'Poppins', sans-serif;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: linear-gradient(180deg, #b3e5fc, #0288d1, #01579b);
			overflow: hidden;
			position: relative;
		}

		body::before {
			content: "";
			position: absolute;
			inset: 0;
			background: url('https://www.transparenttextures.com/patterns/water.png');
			opacity: 0.2;
			animation: moveWater 20s linear infinite;
		}

		@keyframes moveWater {
			from { background-position: 0 0; }
			to { background-position: 1000px 1000px; }
		}

		.form-container {
			position: relative;
			background: rgba(255, 255, 255, 0.2);
			backdrop-filter: blur(25px) saturate(180%);
			padding: 40px 50px;
			border-radius: 20px;
			box-shadow: 0 0 30px rgba(0, 180, 255, 0.4);
			width: 350px;
			text-align: center;
			color: #003f5c;
			z-index: 2;
			transform: translateY(50px);
			opacity: 0;
			animation: formFadeIn 0.4s ease-out forwards; /* ⚡ Much faster animation */
		}

		@keyframes formFadeIn {
			from {
				transform: translateY(50px) scale(0.95);
				opacity: 0;
				filter: blur(4px);
			}
			to {
				transform: translateY(0) scale(1);
				opacity: 1;
				filter: blur(0);
			}
		}

		h2 {
			color: #004d80;
			font-size: 26px;
			font-weight: 700;
			margin-bottom: 25px;
			text-shadow: 0 0 15px rgba(0, 220, 255, 0.5);
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		table {
			width: 100%;
		}

		td {
			padding: 8px 0;
			color: #003f5c;
			font-weight: 600;
			font-size: 14px;
		}

		input {
			width: 90%;
			padding: 10px;
			border: none;
			outline: none;
			border-radius: 8px;
			font-size: 14px;
			background: rgba(255, 255, 255, 0.7);
			box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.15);
			font-family: 'Poppins', sans-serif;
			color: #004d80;
		}

		input:focus {
			border: 2px solid #00bcd4;
			background: #e0f7fa;
			box-shadow: 0 0 10px rgba(0, 230, 255, 0.6);
			transition: 0.3s;
		}

		input[type="submit"] {
			width: 100%;
			margin-top: 15px;
			padding: 12px;
			font-size: 15px;
			font-weight: 600;
			color: white;
			background: linear-gradient(135deg, #00bcd4, #0288d1);
			border: none;
			border-radius: 10px;
			cursor: pointer;
			box-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
			transition: all 0.3s ease;
		}

		input[type="submit"]:hover {
			background: linear-gradient(135deg, #00e5ff, #0277bd);
			transform: scale(1.05);
			box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
		}

		.bubble {
			position: absolute;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.25);
			backdrop-filter: blur(5px);
			box-shadow: 0 0 15px rgba(0, 200, 255, 0.3);
			animation: floatUp 15s infinite ease-in;
		}

		@keyframes floatUp {
			from { transform: translateY(100vh) scale(0.6); opacity: 0.6; }
			to { transform: translateY(-10vh) scale(1.2); opacity: 0; }
		}

		.bubble:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
		.bubble:nth-child(2) { width: 100px; height: 100px; left: 40%; animation-delay: 3s; }
		.bubble:nth-child(3) { width: 60px; height: 60px; left: 70%; animation-delay: 6s; }

		.back-home {
			position: absolute;
			top: 20px;
			left: 20px;
			background: linear-gradient(135deg, #00c6ff, #0072ff);
			color: white;
			padding: 10px 20px;
			border-radius: 8px;
			text-decoration: none;
			font-weight: 600;
			font-size: 14px;
			box-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
			transition: all 0.3s ease;
			z-index: 3;
		}

		.back-home:hover {
			background: linear-gradient(135deg, #00e1ff, #005ecb);
			box-shadow: 0 0 25px rgba(0, 250, 255, 0.8);
			transform: scale(1.05);
		}

		.login-link {
			margin-top: 18px;
			font-size: 15px;
			color: #ffffff;
			text-align: center;
			font-weight: 500;
		}

		.login-link a {
			color: #00ffff;
			text-decoration: none;
			font-weight: 700;
			text-shadow: 0 0 10px rgba(0, 255, 255, 0.9), 0 0 20px rgba(0, 255, 255, 0.6);
			transition: all 0.3s ease-in-out;
		}

		.login-link a:hover {
			color: #ffffff;
			text-shadow: 0 0 15px #00e5ff, 0 0 30px #00bcd4, 0 0 45px #00acc1;
		}

		@media (max-width: 500px) {
			.form-container { width: 85%; padding: 30px; }
			h2 { font-size: 22px; }
			input { font-size: 13px; }
		}
	</style>
</head>

<body>
	<div class="bubble"></div>
	<div class="bubble"></div>
	<div class="bubble"></div>

	<a href="/temp/home/" class="back-home">← Back to Home</a>

	<form method="post">
		{% csrf_token %}
		<div class="form-container">
			<h2>User Register</h2>
			<table>
				<tr><td>First Name:</td><td><input type="text" name="FirstName" required></td></tr>
				<tr><td>Last Name:</td><td><input type="text" name="Lastname" required></td></tr>
				<tr><td>Email ID:</td><td><input type="email" name="emailid" required></td></tr>
				<tr><td>Phone No:</td><td><input type="tel" name="phoneno"
               pattern="[6-9][0-9]{9}"
               maxlength="10"
               placeholder="Enter 10-digit number"
               required></td></tr>
				<tr><td>Username:</td><td><input type="text" name="username" required></td></tr>
				<tr><td>Password:</td><td> <input type="password" name="password"
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@#$%^&+=!]).{8,}"
               title="Password must contain at least 8 characters, including uppercase, lowercase, number, and special character."
               required></td></tr>
				<tr><td colspan="2"><input type="submit" value="Submit"></td></tr>
			</table>

			<p class="login-link">Already have an account? <a href="/login/ login/">Login</a></p>
		</div>
	</form>
</body>
</html>
