<!DOCTYPE html>

<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>View Feedback</title>

<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

/* GLOBAL */

*{
box-sizing:border-box;
}

body{

margin:0;
font-family:'Roboto',sans-serif;

background: linear-gradient(135deg,#0077b6,#00b4d8,#90e0ef);
background-attachment: fixed;

color:white;

}

/* BUBBLE EFFECT */

body::before{

content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background-image:
radial-gradient(circle at 20% 30%, rgba(255,255,255,0.25) 3px, transparent 4px),
radial-gradient(circle at 70% 60%, rgba(255,255,255,0.25) 3px, transparent 4px),
radial-gradient(circle at 40% 80%, rgba(255,255,255,0.25) 3px, transparent 4px);

background-size:200px 200px;

z-index:-1;

}

/* PAGE TITLE */

h1{

text-align:center;

margin-top:90px;

font-size:32px;

letter-spacing:2px;

}

/* BACK BUTTON */

.home-button{

position:absolute;

top:20px;
left:20px;

background:#0077b6;

color:white;

padding:10px 22px;

text-decoration:none;

border-radius:25px;

font-weight:bold;

box-shadow:0 6px 15px rgba(0,0,0,0.3);

transition:0.3s;

}

.home-button:hover{

background:#023e8a;

transform:scale(1.05);

}

/* TABLE */

table{

width:70%;

margin:40px auto;

border-collapse:collapse;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(10px);

border-radius:15px;

overflow:hidden;

box-shadow:0 12px 30px rgba(0,0,0,0.3);

}

/* HEADER */

th{

background:#023e8a;

color:white;

padding:14px;

font-size:16px;

text-transform:uppercase;

}

/* CELLS */

td{

padding:16px;

text-align:center;

font-size:15px;

}

/* USER NAME */

.user-name{

font-weight:bold;

color:#caf0f8;

}

/* FEEDBACK CARD */

.feedback-card{

background:white;

color:#023e8a;

padding:10px 14px;

border-radius:10px;

font-size:14px;

display:inline-block;

max-width:300px;

box-shadow:0 3px 10px rgba(0,0,0,0.2);

}

/* ROW HOVER */

tr:hover{

background:rgba(255,255,255,0.1);

}

/* MOBILE */

@media (max-width:768px){

table{
width:95%;
}

.feedback-card{
max-width:200px;
}

h1{
font-size:24px;
}

}

</style>

</head>

<body>

<a href="/temp/admin/" class="home-button">← Back Home</a>

<h1>View Feedback</h1>

<table>

<tr>

<th>User</th>
<th>Feedback</th>

</tr>

{% for i in feed %}

<tr>

<td class="user-name">{{ i.user.first_name }}</td>

<td>

<div class="feedback-card">

{{ i.feedback }}

</div>

</td>

</tr>

{% endfor %}

</table>

</body>

</html>
