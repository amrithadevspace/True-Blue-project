<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="utf-8">
<title>TRUE BLUE - Water Monitoring Dashboard</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport">

<link href="/static/img/favicon.ico" rel="icon">

<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

<link href="/static/css/style.min.css" rel="stylesheet">

<style>

/* BACKGROUND */

body{
background: linear-gradient(135deg,#0077b6,#00b4d8,#90e0ef);
background-attachment: fixed;
font-family:'Roboto',sans-serif;
}

/* BUBBLES */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image:
radial-gradient(circle at 20% 30%, rgba(255,255,255,0.18) 3px, transparent 4px),
radial-gradient(circle at 70% 60%, rgba(255,255,255,0.18) 3px, transparent 4px);
background-size:200px 200px;
z-index:-1;
}

/* NAVBAR */

.nav-bar{
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
}

/* HERO */

.hero{
height:45vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

/* DASHBOARD */

.dashboard{
margin-top:-60px;
}

/* CARD */

.card-box{
background:rgba(255,255,255,0.08);  /* brightness reduced */
backdrop-filter:blur(10px);
border-radius:15px;
padding:35px;
text-align:center;
transition:0.3s;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.card-box:hover{
transform:translateY(-8px);
box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

.card-box i{
font-size:42px;
margin-bottom:15px;
color:#0077b6;
}

/* BUTTON */

.card-btn{
display:inline-block;
margin-top:10px;
padding:10px 25px;
background:#0077b6;
color:white;
border-radius:25px;
text-decoration:none;
transition:0.3s;
}

.card-btn:hover{
background:#023e8a;
color:white;
}

/* LOGOUT BUTTON */

.logout-btn{
position:absolute;
top:20px;
right:25px;
background:#ff4d4d;
padding:8px 18px;
border-radius:20px;
color:white;
text-decoration:none;
}

.logout-btn:hover{
background:#cc0000;
}

/* FOOTER */

.footer{
background:#023e8a;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="container-fluid p-0 nav-bar">

<nav class="navbar navbar-dark py-3">

<a class="navbar-brand px-lg-4 m-0">

<h1 class="m-0 display-4 text-uppercase text-white">TRUE BLUE</h1>

</a>

<a href="/" class="logout-btn">Logout</a>

</nav>

</div>

<!-- HERO -->

<div class="hero">

<div>

<h1>Water Quality Dashboard</h1>

<p>Smart Monitoring for Safe Water</p>

</div>

</div>

<!-- DASHBOARD -->

<div class="container dashboard">

<div class="row">

<div class="col-md-4 mb-4">

<div class="card-box">

<i class="fas fa-map-marker-alt"></i>

<h4>Nearby Water Quality</h4>

<a href="/nearby/near/" class="card-btn">Open</a>

</div>

</div>

<div class="col-md-4 mb-4">

<div class="card-box">

<i class="fas fa-comment-dots"></i>

<h4>View Complaint</h4>

<a href="/complaint/view/" class="card-btn">Open</a>

</div>

</div>

<div class="col-md-4 mb-4">

<div class="card-box">

<i class="fas fa-robot"></i>

<h4>Chat</h4>

<a href="/chatbot/bot_tech/" class="card-btn">Open</a>

</div>

</div>

</div>

</div>

<!-- FOOTER -->

<div class="container-fluid footer text-white mt-5 pt-5">

<div class="text-center py-3">

<p>SMART WATER QUALITY MONITORING SYSTEM</p>

<p>Designed & developed by Team TRUE BLUE</p>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>

</body>

</html>
