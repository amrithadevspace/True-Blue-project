<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>READING</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background: linear-gradient(135deg, #00bcd4, #00796b);
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden;
			position: relative;
		}

		body::before, body::after {
			content: "";
			position: absolute;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.2);
			filter: blur(2px);
			z-index: 0;
			animation: float 10s infinite ease-in-out alternate;
		}

		body::before {
			width: 180px;
			height: 180px;
			top: 10%;
			left: 20%;
		}

		body::after {
			width: 250px;
			height: 250px;
			bottom: 15%;
			right: 15%;
			background: rgba(255, 255, 255, 0.1);
		}

		.drop {
			position: absolute;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.12);
			filter: blur(1px);
			z-index: 0;
			animation: float 12s infinite ease-in-out alternate;
		}

		.drop:nth-child(1) { width: 60px; height: 60px; top: 25%; left: 10%; }
		.drop:nth-child(2) { width: 100px; height: 100px; bottom: 20%; left: 30%; }
		.drop:nth-child(3) { width: 50px; height: 50px; top: 15%; right: 25%; }
		.drop:nth-child(4) { width: 70px; height: 70px; bottom: 30%; right: 10%; }

		@keyframes float {
			0% { transform: translateY(0px) scale(1); }
			100% { transform: translateY(-30px) scale(1.05); }
		}

		table {
			width: 350px;
			background: rgba(255,255,255,0.15);
			backdrop-filter: blur(12px);
			border-radius: 15px;
			padding: 25px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.2);
			z-index: 1;
		}

		td {
			padding: 10px;
			color: #e0f7fa;
			font-weight: 500;
		}

		input[type="text"] {
			width: 100%;
			padding: 10px;
			border: none;
			border-radius: 8px;
			font-size: 15px;
			outline: none;
			color: #004d40;
			background-color: #ffffff;
			box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.2);
		}

		input[type="submit"] {
			width: 100%;
			padding: 12px;
			margin-top: 15px;
			background: linear-gradient(135deg, #00bcd4, #004d40);
			color: white;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
		}
	</style>
</head>
<body>

	<div class="drop"></div>
	<div class="drop"></div>
	<div class="drop"></div>
	<div class="drop"></div>

	<form method="post">
		<table>
			<tr>
				<td>PH:</td>
				<td><input type="text" name="PH" required></td>
			</tr>
			<tr>
				<td>TURBIDITY:</td>
				<td><input type="text" name="TURBIDITY" required></td>
			</tr>
			<tr>
				<td>TEMPERATURE:</td>
				<td><input type="text" name="TEMPERATURE" required></td>
			</tr>
			<tr>
				<td>TDS:</td>
				<td><input type="text" name="TDS" placeholder="Enter TDS value"></td>
			</tr>
			<tr>
				<td>ALKALINITY:</td>
				<td><input type="text" name="ALKALINITY" placeholder="Enter Alkalinity value"></td>
			</tr>
			<tr>
				<td>CHLORIDE:</td>
				<td><input type="text" name="CHLORIDE" placeholder="Enter Chloride level"></td>
			</tr>
			<tr>
				<td colspan="2">
					<input type="submit" value="Submit Readings">
				</td>
			</tr>
		</table>
	</form>

</body>
</html>
