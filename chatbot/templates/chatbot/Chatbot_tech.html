<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRUE BLUE Chatbot</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

/* WATER BACKGROUND */

body{
margin:0;
font-family:'Roboto',sans-serif;
background: linear-gradient(135deg,#0077b6,#00b4d8,#90e0ef);
background-attachment: fixed;
color:white;
}

/* BUBBLE EFFECT */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background-image:
radial-gradient(circle at 20% 30%, rgba(255,255,255,0.25) 3px, transparent 4px),
radial-gradient(circle at 70% 60%, rgba(255,255,255,0.25) 3px, transparent 4px),
radial-gradient(circle at 40% 80%, rgba(255,255,255,0.25) 3px, transparent 4px);
background-size:200px 200px;
z-index:-1;
}

/* HOME BUTTON */

.home-button{
position:absolute;
top:20px;
left:25px;
background:#0077b6;
color:white;
padding:10px 18px;
border-radius:25px;
text-decoration:none;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
transition:0.3s;
}

.home-button:hover{
background:#023e8a;
transform:scale(1.05);
}

/* CHAT BOX */

.chat-wrapper{

max-width:850px;

margin:80px auto;

height:80vh;

display:flex;

flex-direction:column;

background:rgba(255,255,255,0.15);

backdrop-filter:blur(12px);

border-radius:18px;

box-shadow:0 15px 40px rgba(0,0,0,0.35);

padding:20px;

}

/* CREATIVE TITLE */

.chat-title{

font-size:30px;
text-align:center;
font-weight:700;
letter-spacing:2px;

background:rgba(0,0,0,0.35);
padding:12px 20px;

border-radius:12px;

backdrop-filter:blur(8px);

color:white;

box-shadow:0 4px 15px rgba(0,0,0,0.3);

display:inline-block;
margin:0 auto 15px;

}

.chat-title span{

color:#90e0ef;
font-weight:900;

}

/* CHAT AREA */

.chat-container{

flex-grow:1;

overflow-y:auto;

padding:10px;

display:flex;

flex-direction:column;

gap:12px;

}

/* USER MESSAGE */

.user-message{

align-self:flex-end;

background:#caf0f8;

color:#000;

padding:12px 16px;

border-radius:18px 18px 0 18px;

max-width:70%;

font-size:15px;

box-shadow:0 2px 8px rgba(0,0,0,0.2);

}

/* BOT MESSAGE */

.bot-message{

align-self:flex-start;

background:white;

color:#023e8a;

padding:12px 16px;

border-radius:18px 18px 18px 0;

max-width:70%;

font-size:15px;

box-shadow:0 2px 8px rgba(0,0,0,0.2);

white-space:pre-wrap;

}

/* INPUT BAR */

.input-bar{

margin-top:15px;

display:flex;

justify-content:center;

}

.input-bar form{

display:flex;

width:100%;

gap:10px;

}

.input-bar input{

flex-grow:1;

padding:12px 16px;

border-radius:25px;

border:none;

font-size:15px;

outline:none;

}

.input-bar button{

background:#0077b6;

border:none;

padding:12px 22px;

color:white;

border-radius:25px;

font-weight:bold;

cursor:pointer;

transition:0.3s;

}

.input-bar button:hover{

background:#023e8a;

}

/* SCROLLBAR */

.chat-container::-webkit-scrollbar{
width:8px;
}

.chat-container::-webkit-scrollbar-thumb{
background:#0077b6;
border-radius:4px;
}

/* MOBILE */

@media (max-width:600px){

.chat-wrapper{

margin:60px 10px;

height:85vh;

}

.chat-title{

font-size:22px;

}

}

</style>

</head>

<body>

<a href="/temp/technician/" class="home-button">← Home</a>

<div class="chat-wrapper">

<h1 class="chat-title">TRUE BLUE <span>ChatBOT</span></h1>

<div class="chat-container">

{% if res %}

<div class="user-message">{{ request.POST.Chatbot }}</div>

<div class="bot-message">{{ res }}</div>

{% endif %}

</div>

<div class="input-bar">

<form method="post" autocomplete="off">

{% csrf_token %}

<input type="text" name="Chatbot" placeholder="Ask something about water quality..." required>

<button type="submit">Send</button>

</form>

</div>

</div>

<script>

const chatContainer = document.querySelector('.chat-container');

if(chatContainer){
chatContainer.scrollTop = chatContainer.scrollHeight;
}

</script>

</body>

</html>
