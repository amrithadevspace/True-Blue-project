<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Manage Users</title>

	<!-- Google Font -->
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

	<style>
		body {
			margin: 0;
			padding: 0;
			font-family: 'Poppins', sans-serif;
			background: linear-gradient(135deg, #b3e5fc, #0288d1, #01579b);
			color: #00334e;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			position: relative;
			overflow: hidden;
		}

		/* Subtle animated water texture */
		body::before {
			content: "";
			position: absolute;
			inset: 0;
			background: url('https://www.transparenttextures.com/patterns/water.png');
			opacity: 0.15;
			animation: moveWater 30s linear infinite;
		}
		@keyframes moveWater {
			from { background-position: 0 0; }
			to { background-position: 1000px 1000px; }
		}

		/* Back Home Button */
		.back-home {
			position: absolute;
			top: 20px;
			left: 25px;
			background: linear-gradient(135deg, #00bcd4, #0288d1);
			color: white;
			padding: 10px 18px;
			border-radius: 10px;
			font-weight: 600;
			text-decoration: none;
			box-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
			transition: 0.3s;
			z-index: 3;
		}
		.back-home:hover {
			background: linear-gradient(135deg, #00e5ff, #0277bd);
			transform: scale(1.05);
			box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
		}

		.container {
			position: relative;
			z-index: 2;
			width: 90%;
			max-width: 1100px;
			background: rgba(255, 255, 255, 0.15);
			backdrop-filter: blur(15px);
			border-radius: 20px;
			padding: 30px;
			box-shadow: 0 0 30px rgba(0, 200, 255, 0.4);
			overflow-x: auto;
		}

		h1 {
			text-align: center;
			color: #004d80;
			font-weight: 700;
			font-size: 28px;
			margin-bottom: 25px;
			text-shadow: 0 0 10px rgba(0, 220, 255, 0.5);
			letter-spacing: 1px;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			color: #00334e;
			border-radius: 10px;
			overflow: hidden;
			box-shadow: 0 0 20px rgba(0, 100, 255, 0.15);
		}

		th, td {
			padding: 14px 10px;
			text-align: center;
			border-bottom: 1px solid rgba(255, 255, 255, 0.3);
		}

		th {
			background: rgba(0, 80, 130, 0.9);
			color: #e0f7fa;
			text-transform: uppercase;
			font-size: 14px;
			letter-spacing: 1px;
		}

		td {
			background: rgba(255, 255, 255, 0.25);
			font-size: 14px;
			font-weight: 500;
		}

		tr:nth-child(even) td {
			background: rgba(255, 255, 255, 0.4);
		}

		tr:hover td {
			background: rgba(0, 200, 255, 0.2);
			transition: 0.3s;
		}

		a {
			text-decoration: none;
			padding: 6px 14px;
			border-radius: 6px;
			font-weight: 600;
			transition: 0.3s;
		}

		{#a[href*="accept"] {#}
		{#	background: linear-gradient(135deg, #00e676, #00bfa5);#}
		{#	color: white;#}
		{#	box-shadow: 0 0 10px rgba(0, 255, 170, 0.5);#}
		{#}#}

		a[href*="delete"] {
			background: linear-gradient(135deg, #ff5252, #d50000);
			color: white;
			box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
		}

		a:hover {
			transform: scale(1.05);
			filter: brightness(1.2);
		}

		@media (max-width: 768px) {
			table, th, td {
				font-size: 12px;
			}
			h1 {
				font-size: 22px;
			}
		}
	</style>
</head>

<body>
	<a href="/temp/admin/" class="back-home">← Back to Home</a>

	<div class="container">
		<h1>Manage Users</h1>
		<table>
			<tr>
				<th>First Name</th>
				<th>Last Name</th>
				<th>Email ID</th>
				<th>Phone No.</th>
				<th>Username</th>
				<th>Password</th>
{#				<th>Status</th>#}
				<th colspan="2">Actions</th>
			</tr>

			{% for i in user %}
			<tr>
				<td>{{ i.first_name }}</td>
				<td>{{ i.last_name }}</td>
				<td>{{ i.email_id }}</td>
				<td>{{ i.phon_no }}</td>
				<td>{{ i.user_name }}</td>
				<td>{{ i.password }}</td>
{#				<td>{{ i.status }}</td>#}
				<td><a href="/user/delete/{{ i.user_id }}">Delete</a></td>
{#				<td><a href="/user/reject/{{ i.user_id }}">Reject</a></td>#}
			</tr>
			{% endfor %}
		</table>
	</div>
</body>
</html>
