<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>READING</title>

<style>
body {
	margin: 0;
	padding: 0;
	font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
	background: linear-gradient(135deg, #00bcd4, #00796b);
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	overflow-x: hidden;
}

/* Floating bubbles */
body::before, body::after {
	content: "";
	position: absolute;
	border-radius: 50%;
	background: rgba(255, 255, 255, 0.15);
	filter: blur(2px);
	z-index: 0;
	animation: float 10s infinite ease-in-out alternate;
}
body::before { width:200px; height:200px; top:10%; left:15%; }
body::after { width:260px; height:260px; bottom:10%; right:15%; }

@keyframes float {
	0% { transform: translateY(0px) scale(1); }
	100% { transform: translateY(-30px) scale(1.05); }
}

.container {
	display: flex;
	gap: 30px;
	align-items: flex-start;
	justify-content: center;
	flex-wrap: wrap;
	width: 100%;
	padding: 20px;
	z-index: 1;
}

/* Card Common Style */
.card {
	background: rgba(255,255,255,0.15);
	backdrop-filter: blur(14px);
	border-radius: 20px;
	box-shadow: 0 10px 30px rgba(0,0,0,0.25);
	border: 2px solid rgba(255,255,255,0.2);
	padding: 25px;
	color: white;
}

/* Reading Box */
.reading-box {
	width: 320px;
	text-align: center;
}

.title {
	font-size: 24px;
	font-weight: 800;
	letter-spacing: 1px;
	margin-bottom: 15px;
	text-transform: uppercase;
	position: relative;
}
.title::after {
	content: "";
	width: 70px;
	height: 3px;
	background: linear-gradient(90deg, #ffffff, #00e5ff);
	display: block;
	margin: 8px auto 0;
	border-radius: 3px;
}

table { width:100%; }

td {
	padding: 7px;
	font-weight: 600;
	font-size: 14px;
	text-align: left;
	color: #e0f7fa;
}

input[type="text"] {
	width: 100%;
	padding: 9px;
	border: none;
	border-radius: 10px;
	font-size: 14px;
	outline: none;
	color: #004d40;
	background-color: #ffffff;
	box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
}

.submit-btn {
	width: 100%;
	padding: 12px 0;
	border: none;
	border-radius: 10px;
	background: linear-gradient(135deg, #00e5ff, #004d40);
	color: #ffffff;
	font-size: 16px;
	font-weight: bold;
	cursor: pointer;
	box-shadow: 0 5px 18px rgba(0,0,0,0.3);
	transition: all 0.3s ease;
}
.submit-btn:hover {
	background: linear-gradient(135deg, #00acc1, #003d33);
	transform: translateY(-2px);
}

/* Result Box */
.result-box {
	max-width: 420px;
	min-width: 280px;
	text-align: left;
	animation: fadeUp 0.6s ease;
	word-wrap: break-word;
}

@keyframes fadeUp {
	from { opacity:0; transform: translateY(30px); }
	to { opacity:1; transform: translateY(0); }
}

.result-box h2 {
	margin-top: 0;
	font-size: 22px;
	letter-spacing: 0.5px;
	text-align:center;
}

.result-points {
	list-style: none;
	padding: 0;
	margin-top: 15px;
}

.result-points li {
	background: rgba(255,255,255,0.18);
	margin-bottom: 12px;
	padding: 12px 15px 12px 45px;
	border-radius: 14px;
	font-size: 15px;
	line-height: 1.6;
	font-weight: 600;
	position: relative;
	color: #ffffff;
	box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
}

.result-points li::before {
	content: "💧";
	position: absolute;
	left: 15px;
	top: 10px;
	font-size: 18px;
}

/* Mobile Responsive */
@media(max-width: 768px){
	.container{
		flex-direction: column;
		align-items: center;
	}
	.reading-box, .result-box{
		width: 90%;
	}
}
</style>
</head>

<body>

<div class="container">

	<!-- Reading Form -->
	<div class="card reading-box">
		<div class="title">Water Readings</div>

	<form method="post">{% csrf_token %}
		<table>
			<tr>
				<td><strong>PH:</strong></td>
				<td><input type="text" name="PH" value="{{ i.ph }}" required></td>
			</tr>
			<tr>
				<td><strong>TURBIDITY:</strong></td>
				<td><input type="text" name="TURBIDITY" value="{{ i.turbidity }}" required></td>
			</tr>
			<tr>
				<td><strong>TEMPERATURE:</strong></td>
				<td><input type="text" name="TEMPERATURE" value="{{ i.temperature }}" required></td>
			</tr>
			<tr>
				<td><strong>TDS:</strong></td>
				<td><input type="text" name="TDS" placeholder="Enter Manually"></td>
			</tr>
			<tr>
				<td><strong>ALKALINITY:</strong></td>
				<td><input type="text" name="ALKALINITY" placeholder="Enter Manually"></td>
			</tr>
			<tr>
				<td><strong>CHLORIDE:</strong></td>
				<td><input type="text" name="CHLORIDE" placeholder="Enter Manually"></td>
			</tr>
			<tr>
				<td colspan="2">
					<input type="submit" value="Submit Readings" class="submit-btn">
				</td>
			</tr>
		</table>
	</form>
	</div>

	<!-- Result Box -->
	{% if result %}
	<div class="card result-box">
		<h2>💧 Water Quality Analysis</h2>
		<ul id="resultList" class="result-points"></ul>
		<p id="resultText" style="display:none;">{{ result }}</p>
	</div>
	{% endif %}

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
	const textEl = document.getElementById("resultText");
	const listEl = document.getElementById("resultList");

	if (textEl && listEl) {
		let sentences = textEl.innerText
			.replace(/\s+/g, " ")
			.split(". ");

		sentences.forEach(function(sentence) {
			if(sentence.trim().length > 0){
				let li = document.createElement("li");
				li.textContent = sentence.replace(".", "");
				listEl.appendChild(li);
			}
		});
	}
});
</script>

</body>
</html>
